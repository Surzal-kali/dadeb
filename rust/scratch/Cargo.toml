[package]
name = "scratch"
version = "0.1.0"
edition = "2021"
description = "Rust port of the dadeb scratch store (SQLite metadata + gzip payload files, agent-scoped ownership, opaque refs)"
license = "GPL-3.0-or-later"

[dependencies]
# SQLite metadata lane. `bundled` compiles libsqlite3 from source so the crate
# has no system libsqlite3 dependency — same schema/WAL semantics as the
# Python store (utils/scratch_store.py) so both can operate the same db.
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
# gzip: python's gzip.compress(level=6) / gzip.open(multistream) equivalents.
flate2 = "1"
# sha256 integrity stamp of the compressed payload.
sha2 = "0.10"
# regex_pattern / filter_pattern projection (python `re` with IGNORECASE).
regex = "1"
# 16-hex unguessable scratch ids from the OS entropy pool (secrets.token_hex(8)).
# Kept tiny on purpose — no rand dependency for 8 bytes of entropy.
getrandom = "0.2"
# Unix-only syscalls the root guard needs (stat uid/gid, chown). Same crates
# and features as rust/brain.
nix = { version = "0.29", features = ["fs", "user"] }

[dev-dependencies]
tempfile = "3"