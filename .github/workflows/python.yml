name: python

# Gate for the Python harness: the pytest suite (registry, dispatch, scope
# gate, jobs, schedulers, ...) plus an execution-free discovery smoke —
# every .py under the indexed tool roots must survive an ast parse, so a
# syntax-broken module can never land silently in an operator's registry.
on:
  push:
    paths: ["**.py", "pyproject.toml", "requirements.txt", ".github/workflows/python.yml"]
  pull_request:
    paths: ["**.py", "pyproject.toml", "requirements.txt", ".github/workflows/python.yml"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Hermetic determinism: no ambient endpoint to half-answer, no host
      # customizations leaking into lanes.
      EMBED_URL: ""            # unset → the embed lane stays a stubbed HTTP lane in tests
      DACUSTOMS_DIR: ""        # no operator customs dir on the runner
      WORKSPACE_ROOT: ""       # lanes must resolve the checkout, not a host pin
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the framework + test deps
        # Core runtime + dev (pytest). The optional lanes ([web]/[jupyter]/[db])
        # are not exercised hermetically; the code paths that touch them
        # degrade honestly on this runner just like they do on a box
        # without playwright/ipykernel/psycopg.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show the resolved stack
        run: |
          python -V
          pip list

      - name: Test
        # Same invocation the REPL selftest macro runs (`python -m pytest
        # tests/ -q`); the pyproject ini carries testpaths/pythonpath/
        # strict-markers/strict-config already.
        run: |
          python -m pytest tests/ -q

  discovery-smoke:
    # The static half of tool discovery, run WITHOUT the embed endpoint:
    # ast-parses every candidate module under ALLOWED_TOOL_ROOTS. This is
    # the check the README's pytest suite alone does not carry — one broken
    # module under an indexed root = one hole in the operator's registry.
    # (No subprocess minting, no embedding, no imports — pure ast.)
    runs-on: ubuntu-latest
    env:
      DACUSTOMS_DIR: ""
      WORKSPACE_ROOT: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static-parse every indexed tool module
        run: |
          python - <<'EOF'
          import ast, sys
          from pathlib import Path

          roots = [Path(p) for p in ("auxiliaries", "payloads", "listeners", "utils")]
          skip_dirs = {"venv", ".venv", "env", "ENV", "node_modules", ".git",
                       "__pycache__", ".pytest_cache", ".tox", "build", "dist"}

          failures = []
          checked = 0
          for root in roots:
              for path in sorted(root.rglob("*.py")):
                  if any(part in skip_dirs for part in path.parts):
                      continue
                  try:
                      ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                      checked += 1
                  except SyntaxError as exc:
                      failures.append(f"{path}: {exc}")

          print(f"ast-parsed {checked} modules under {len(roots)} indexed roots")
          if failures:
              print("\n".join(failures))
              sys.exit(f"{len(failures)} module(s) failed to parse — static "
                       f"discovery would skip or wedge on them")
          EOF
