# daharness budget-ration constitution -- DEFAULT law.
#
# These values mirror the engine's code defaults exactly; the loader pins
# in tests/test_ration_a.py verify this file and the no-env law are
# field-for-field identical.
#
# Wiring: point BUDGET_CONSTITUTION_FILE at a live copy
#   (suggested: /etc/daharness/budget.yaml -- on deb installs the
#   postinst seeds this file from the package copy AND activates the env
#   on-ramp; a file seeded here IS this shipped default until edited).
#   .json is the stdlib-only leg; this .yaml leg additionally needs
#   python3-yaml (deb Suggests).
# Reload: file CONTENT is re-read at every constitution() call -- edit it
#   and live lanes pick it up per-call. Changing the ENV (which file, or
#   switching lanes from defaults to file) needs a fresh unit/shell env.
# Authoring contract (fail-closed, NEVER silently reinterpreted):
#   - unknown top-level keys raise -> engine serves constitutional INVALID
#     and the rationed lanes stay fail-closed until the config is fixed
#   - per_dim needs ceiling AND floor per dim; refill_per_epoch optional
#   - a ceiling below that dim's max_single_call is REFUSED (never-fit:
#     "declare smaller -- rate-limited sweep instead of one full call")
#
# The four spending dimensions (DIMS), keyed per engagement+host+node:
#   requests     HTTP requests emitted
#   packets      raw/scanner packet spend (masscan-class)
#   auth_events  authentication attempts against remote principals
#   bytes        response bytes read into the harness
# Every node re-mints from THIS law at engagement cold-start.

per_dim:
  requests:
    ceiling: 600             # burst top-up
    refill_per_epoch: 150    # drip per epoch (floor keeps HOLD-mode alive)
    floor: 2
  packets:
    ceiling: 2000000
    refill_per_epoch: 250000
    floor: 500
  auth_events:
    ceiling: 60
    refill_per_epoch: 5
    floor: 0.2
  bytes:
    ceiling: 268435456       # 256 MiB
    refill_per_epoch: 33554432   # 32 MiB
    floor: 262144            # 256 KiB

max_single_call:             # a single declared call above this is REJECTed
  requests: 600
  packets: 2000000
  auth_events: 60
  bytes: 268435456

epoch_seconds: 300           # refill epoch length (0 < n); the lab drum-steady
                             # default -- 150 requests/5 min ≈ 1800/h, a full
                             # 4614-line wordlist ≈ 2.5h (was 3600/100 ≈ 40h+)

store: "sqlite"              # validated literal -- the sole leg; do not edit

